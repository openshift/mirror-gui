apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mirror-gui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mirror-gui.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mirror-gui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mirror-gui.labels" . | nindent 8 }}
      {{- with .Values.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: mirror-gui
          image: "{{ (.Values.image).repository }}:{{ (.Values.image).tag }}"
          imagePullPolicy: {{ (.Values.image).pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: STORAGE_DIR
              value: /app/data
            - name: OC_MIRROR_CACHE_DIR
              value: /app/cache
            - name: OC_MIRROR_BASE_MIRROR_DIR
              value: /app/data/mirrors
            - name: TMPDIR
              value: /tmp
            {{- if (.Values.pullSecret).existingSecret }}
            - name: OC_MIRROR_AUTHFILE
              value: /app/pull-secret/{{ (.Values.pullSecret).key }}
            {{- end }}
            {{- if or (.Values.proxy).httpProxy (.Values.proxy).httpsProxy }}
            {{- /* Both cases are set because Go tools (oc-mirror, oc) and Node read different ones.
                   NODE_USE_ENV_PROXY makes Node's built-in fetch honor them. */}}
            - name: NODE_USE_ENV_PROXY
              value: "1"
            {{- range $name, $value := dict "HTTP_PROXY" (.Values.proxy).httpProxy "HTTPS_PROXY" (.Values.proxy).httpsProxy "NO_PROXY" (.Values.proxy).noProxy }}
            {{- if $value }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            - name: {{ lower $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- /* The server is transpiled at boot by tsx, so a cold node can take well over
                 the ~25s the liveness defaults allow. The startup probe holds off liveness
                 and readiness until the app answers, or fails the pod after 2.5 minutes. */}}
          startupProbe:
            httpGet:
              path: /api/health
              port: 3001
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: cache
              mountPath: /app/cache
            - name: tmp
              mountPath: /tmp
            {{- if (.Values.pullSecret).existingSecret }}
            - name: pull-secret
              mountPath: /app/pull-secret
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if (.Values.persistence).enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mirror-gui.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: cache
          {{- if (.Values.cachePersistence).enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mirror-gui.fullname" . }}-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          {{- with (.Values.tmpDir).sizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if (.Values.pullSecret).existingSecret }}
        - name: pull-secret
          secret:
            secretName: {{ (.Values.pullSecret).existingSecret }}
            items:
              - key: {{ (.Values.pullSecret).key }}
                path: {{ (.Values.pullSecret).key }}
        {{- end }}
