{{- if (.Values.networkPolicy).enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mirror-gui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mirror-gui.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- include "mirror-gui.stringMap" . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "mirror-gui.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or (.Values.route).enabled (.Values.networkPolicy).ingressFrom }}
  ingress:
    {{- if (.Values.route).enabled }}
    # The OpenShift router, which serves the Route.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    {{- with (.Values.networkPolicy).ingressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
